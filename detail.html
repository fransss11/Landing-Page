<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Detail Gambar</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <style>
    /* General Styling */
    body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        color: #333;
        margin: 0;
        padding: 0;
    }

    /* Container Styling */
    .container {
        max-width: 800px;
        margin: auto;
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }

    /* Heading */
    h3 {
        font-size: 28px;
        font-weight: bold;
        color: #007bff;
    }

    /* Image Styling */
    #image-container img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    }

    /* Description */
    p {
        font-size: 18px;
        line-height: 1.6;
        margin-top: 10px;
    }

    /* Back Button */
    .btn-primary {
        background-color: #007bff;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        text-decoration: none;
        transition: 0.3s;
    }

    .btn-primary:hover {
        background-color: #0056b3;
    }

    /* Animasi Fade In */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Terapkan animasi ke elemen */
    #image-container img, h5, p {
        animation: fadeIn 1s ease-in-out;
    }

    /* Tambahkan efek hover ke gambar */
    #image-container img:hover {
        transform: scale(1.05);
        transition: transform 0.3s ease-in-out;
    }

    /* #image-container img {
    animation-delay: 0.3s;
    } */

    h5 {
        animation-delay: 0.5s;
    }

    p {
        animation-delay: 0.7s;
    }
    </style>
</head>

<body>

    <div class="container text-center py-5">
        <h3 class="mb-4">Detail Gambar</h3>
        <div id="image-container"></div>
        <a href="galery.html" class="btn btn-primary mt-3">Kembali ke Galeri</a>
    </div>

    <script>
        const images = {
            1: { src: "img/1.png", title: "CV. BERKAT JAYA PLASTIND", description: "Perusahaan manufaktur plastik terkemuka yang menyediakan berbagai produk berkualitas tinggi untuk kebutuhan industri dan rumah tangga." },
            2: { src: "img/1.png", title: "Delta Tirta", description: "Perusahaan yang bergerak di bidang pengolahan dan distribusi air bersih dengan standar kualitas terbaik." },
            3: { src: "img/1.png", title: "Inkote", description: "Penyedia tinta industri yang telah beroperasi sejak 1970, terkenal dengan inovasi dan kualitas produknya." },
            4: { src: "img/1.png", title: "Astra Asuransi", description: "Salah satu perusahaan asuransi terpercaya di Indonesia yang menyediakan perlindungan kendaraan, properti, dan jiwa." },
            5: { src: "img/1.png", title: "Arabic Brand", description: "Merek terkenal dengan produk makanan dan minuman khas Timur Tengah yang berkualitas tinggi." },
            6: { src: "img/1.png", title: "Brand Enam", description: "Sebuah perusahaan yang bergerak dalam produksi kemasan inovatif untuk berbagai industri." },
            7: { src: "img/1.png", title: "Kementerian Kesehatan RI", description: "Lembaga pemerintah yang bertanggung jawab atas kebijakan kesehatan nasional dan peningkatan kesejahteraan masyarakat." },
            8: { src: "img/1.png", title: "Indofarma", description: "Perusahaan farmasi nasional yang memproduksi obat-obatan berkualitas untuk mendukung kesehatan masyarakat Indonesia." },
            9: { src: "img/1.png", title: "PT Rajawali Tarjungsari", description: "Perusahaan konstruksi dan rekayasa yang berfokus pada pengembangan infrastruktur dan proyek industri." },
            10: { src: "img/1.png", title: "Vascomm", description: "Perusahaan teknologi yang menyediakan solusi digital dan sistem pembayaran modern untuk berbagai sektor industri." }
        };

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const imageId = getQueryParam('id');
        const imageDetail = images[imageId];

        if (imageDetail) {
            document.getElementById("image-container").innerHTML = `
                <img src="${imageDetail.src}" class="img-fluid mb-3" alt="${imageDetail.title}">
                <h5 class="mt-3">${imageDetail.title}</h5>
                <p>${imageDetail.description}</p>
            `;
        } else {
            document.getElementById("image-container").innerHTML = "<p>Gambar tidak ditemukan.</p>";
        }
    </script>

</body>

</html>
